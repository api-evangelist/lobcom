  notice_period: not published
  note: >
    Lob states a real deprecation outcome (everything through 2019-02-11 is sunsetted) and
    guarantees that a pinned older version keeps working until it is sunsetted, but publishes no
    notice window and emits neither the RFC 8594 Sunset nor the Deprecation response header. Beta
    APIs are documented as going through "more frequent versioning and version deprecation
