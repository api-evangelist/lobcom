versioning:
  scheme: date-versioned-api + semver-spec
  api_version: '2020-02-11'
  spec_version: 1.22.3
  current: '2020-02-11'
  header: Lob-Version
  mechanism: >
    The account's API version is pinned in Dashboard Settings and can be overridden per-request
    with the Lob-Version header (e.g. `-H "Lob-Version: 2020-02-11"`). Backwards-incompatible
    changes ship as a new dated version, explicitly following the Stripe versioning model. The
    API rejects a version older than the account's current pin. The OpenAPI specification is
    versioned separately with semver, because backward-compatible spec changes do not require a
    new API version; SDK releases are cut from the spec version.
  url_versioning: /v1 path prefix on api.lob.com, stable since launch
  docs: https://docs.lob.com/#tag/Versioning-and-Changelog
