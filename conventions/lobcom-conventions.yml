authentication:
  style: http-basic
  detail: >
    API key sent as the HTTP Basic username (password blank). Secret keys (test_*/live_*)
    have full access; publishable keys ([env]_pub) are limited to verifications and autocomplete.
  ref: authentication/lobcom-authentication.yml
idempotency:
  supported: true
  header: Idempotency-Key
  query_param: idempotency_key
  max_length: 256
  scope: POST create operations
  detail: >
    Provide a unique Idempotency-Key header (or idempotency_key query param) on create
    requests so retries do not create duplicate mail pieces. Keys up to 256 characters.
