              cancel_window_campaign_minutes: 60
              metadata: {}
              use_type: marketing
              is_draft: true
              deleted: false
              creatives: []
              uploads: []
              auto_cancel_if_ncoa: false
              date_created: '2017-09-05T17:47:53.767Z'
              date_modified: '2017-09-05T17:47:53.767Z'
              object: campaign
            object: list
            previous_url: null
            next_url: null
            count: 1
    campaigns_error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
