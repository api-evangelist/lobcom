free_tier:
  available: true
  note: >
    The Developer plan is $0/month. Separately, the OpenAPI documents that a payment method is
    not required for the first 300 live requests per month to POST /v1/us_verifications; after
    that the endpoint returns HTTP 403. Test-mode (test_ prefixed keys) is never charged.
