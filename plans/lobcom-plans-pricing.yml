note: >
  Lob prices two products on one page and they tier independently: Print & Mail (the
  subscription tiers below, with per-piece print+postage rates attached to each) and Address
  Verification (a separate per-tier bundle with its own included volume and overage). The
  subscription price is a floor ("starting at") — Lob quotes annual mailing volume, not API
  call quota, so the metered unit is a physical mailpiece rather than a request. Enterprise is
  the only tier without a published price.
