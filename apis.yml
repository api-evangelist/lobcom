aid: lobcom
name: Lob.com
description: >-
  Lob is the direct-mail and address-verification API for developers. Its REST API lets teams
  programmatically create and mail postcards, letters, checks, self-mailers, snap packs, booklets,
  buckslips and cards; verify and autocomplete US and international addresses; run direct-mail and
  USPS Informed Delivery campaigns; manage HTML templates; and track physical delivery through USPS
  scan events surfaced over webhooks. The API is organized around REST with resource-oriented URLs,
  HTTP Basic authentication using test_/live_ API keys, cursor pagination, Idempotency-Key support,
  and standard rate-limit headers. Lob was surfaced as an a16z portfolio company and enriched into
  the API Evangelist network from its public OpenAPI, docs, SDKs, and registries.
