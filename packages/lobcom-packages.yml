note: >
  Lob ships first-party, OpenAPI-generated SDKs in nine languages, all under github.com/lob.
  Most were re-cut together on 2026-06-05 from spec v1.22.x, which is a healthy currency signal.
  TWO DOCUMENTATION DEFECTS were found while dating these packages and are recorded verbatim
  below rather than smoothed over: (1) Lob's own SDK page tells Python users `pip install lob`,
  but PyPI `lob` has not been released since 2022-02-19 (4.5.4) — the maintained package is
  `lob-python` 5.2.0, published 2026-06-05 from the same repo; (2) NuGet `lob.net` is stuck at
  1.0.0-beta3 (2020-04-03) while the maintained .NET package is `lob.dotnet` 1.2.0 (2026-06-05).
  A consumer following the published install instructions lands on a four-year-old client.
